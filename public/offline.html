<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0038a8">
<title>You're offline | LGU Connect</title>
<script>
  // Same theme choice as the rest of the site (see src/lib/theme.ts).
  try {
    var t = localStorage.getItem("lgu-theme") || "system";
    if (t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.className = "dark";
  } catch (e) {}
</script>
<style>
  :root { --ground: #fcfcfd; --panel: #ffffff; --ink: #16191f; --muted: #454c58; --rule: #dde0e6; --fill: #0038a8; color-scheme: light; }
  .dark { --ground: #0b1120; --panel: #141e33; --ink: #e8edf6; --muted: #a5b0c6; --rule: #27344f; --fill: #1d4ed8; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--ground); color: var(--ink);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .flag { position: fixed; inset: 0 0 auto; height: 4px; background: linear-gradient(90deg, #0038a8 0 50%, #ce1126 50%); }
  main { max-width: 420px; width: 100%; text-align: center; background: var(--panel); border: 1px solid var(--rule); border-radius: 16px; padding: 32px 28px; }
  img { width: 72px; height: 72px; }
  .dark .light, :root:not(.dark) .dark-only { display: none; }
  h1 { font-size: 22px; line-height: 1.25; margin: 16px 0 8px; }
  p { margin: 0 0 12px; color: var(--muted); }
  button { margin-top: 12px; font: inherit; font-weight: 600; color: #fff; background: var(--fill); border: 0; border-radius: 10px; padding: 11px 22px; cursor: pointer; }
  button:focus-visible { outline: 3px solid #fcd116; outline-offset: 2px; }
  small { display: block; margin-top: 16px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="flag" aria-hidden="true"></div>
<main>
  <img class="light" src="/brand/lgu-icon.svg" alt="">
  <img class="dark-only" src="/brand/lgu-icon-dark.svg" alt="">
  <h1>You're offline</h1>
  <p>LGU Connect needs an internet connection to load records. Check your Wi-Fi or mobile data.</p>
  <p>Nothing you saved before is lost.</p>
  <button type="button" onclick="location.reload()">Try again</button>
  <small>This page reloads on its own when the connection comes back.</small>
</main>
<script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
